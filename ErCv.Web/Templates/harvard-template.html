<!DOCTYPE html>
<html lang="{{Lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{FullName}} - Resume</title>
    <style>
        @page { size: letter; margin: 0.65in 0.7in 0.55in 0.7in; }

{{> base-styles}}

        /* ─── Harvard: classic, centered header, ruled uppercase titles ─── */
        :root {
            --cv-text: #000000;
            --cv-muted: #000000;
            --cv-accent: #000000;
            --cv-lh: 1.2;
        }

        .cv-header { margin-bottom: calc(var(--cv-step) * 3); text-align: center; }

        .cv-name {
            font-weight: bold;
            letter-spacing: 1pt;
            margin-bottom: calc(var(--cv-step) * 1.5);
            text-transform: uppercase;
        }

        .cv-contact { line-height: 1.3; }

        .cv-section-title {
            border-bottom: 1.5pt solid var(--cv-accent);
            letter-spacing: 0.5pt;
            padding-bottom: 1pt;
            text-transform: uppercase;
        }

        .cv-summary { line-height: 1.35; text-align: justify; }
        .cv-bullets { margin-left: 15pt; }
    </style>
</head>
<body class="{{StyleClasses}}">
    <header class="cv-header">
        <h1 class="cv-name">{{FullName}}</h1>
        <div class="cv-contact">{{> contact}}</div>
    </header>

{{> sections}}
</body>
</html>
