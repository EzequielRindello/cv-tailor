<!DOCTYPE html>
<html lang="{{Lang}}">
<head>
    <meta charset="UTF-8">
    <title>{{FullName}} - Resume</title>
    <style>
        @page { size: letter; margin: 0.7in 0.8in 0.6in 0.8in; }

{{> base-styles}}

        /* ─── Minimalist: light weights, spaced small-caps titles, plenty of white space ─── */
        :root {
            --cv-text: #333333;
            --cv-muted: #777777;
            --cv-accent: #8a8a8a;
            --cv-font-body: Helvetica, Arial, Liberation Sans, sans-serif;
            --cv-font-heading: Helvetica, Arial, Liberation Sans, sans-serif;
            --cv-contact-sep: "  ·  ";
            --cv-fs-small: 8.5pt;
            --cv-fs-section: 8pt;
            --cv-fs-name: 20pt;
            --cv-lh: 1.38;
        }

        .cv-header {
            border-bottom: 0.5pt solid #cccccc;
            margin-bottom: calc(var(--cv-step) * 5);
            padding-bottom: calc(var(--cv-step) * 4);
        }

        .cv-name { color: #111111; font-weight: normal; letter-spacing: 4pt; margin-bottom: calc(var(--cv-step) * 2); text-transform: uppercase; }
        .cv-contact { color: #666666; letter-spacing: 0.3pt; white-space: pre-wrap; }

        .cv-section { margin-top: calc(var(--cv-step) * 5); }
        .cv-section-title { font-weight: normal; letter-spacing: 3pt; text-transform: uppercase; }

        .cv-summary { color: #444444; font-style: italic; }
        .cv-entry-head { font-weight: 600; }
        .cv-entry-dates { color: var(--cv-muted); font-size: var(--cv-fs-small); }
        .cv-entry-sub { font-style: normal; }

        .cv-bullets { list-style: none; margin-left: 0; }
        .cv-bullets li { color: #444444; font-size: 9.5pt; padding-left: 12pt; position: relative; }
        .cv-bullets li::before { color: #bbbbbb; content: "–"; left: 0; position: absolute; }

        .cv-skill-name { color: #666666; font-size: var(--cv-fs-small); font-weight: normal; letter-spacing: 1pt; text-transform: uppercase; }
        .cv-project-title { font-weight: 600; }
    </style>
</head>
<body class="{{StyleClasses}}">
    <header class="cv-header">
        <h1 class="cv-name">{{FullName}}</h1>
        <div class="cv-contact">{{> contact}}</div>
    </header>

{{> sections}}
</body>
</html>
