<section class="cv-section cv-section-education">
    <h2 class="cv-section-title">{{Labels.Education}}</h2>
    {{#Education}}
    <div class="cv-entry">
        <div class="cv-entry-head"><span class="cv-entry-title">{{Place}}</span><span class="cv-entry-dates">{{GraduationDate}}</span></div>
        {{#Degree}}<div class="cv-entry-sub">{{Degree}}</div>{{/Degree}}
    </div>
    {{/Education}}
</section>
