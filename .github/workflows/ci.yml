name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The corpus refresh starts it on its own PR branch: a PR opened with GITHUB_TOKEN does not trigger pull_request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runner image ships Google Chrome. Pointing PuppeteerSharp at it skips its own Chromium download.
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore er-cv-generator.sln

      - name: Build
        run: dotnet build er-cv-generator.sln --no-restore --configuration Release

      # Unit, invariant, document (DOCX, PDF, HTML), snapshot and API integration tests, with line coverage (TEST-10).
      # Only ErCv.Tests: the browser tests run in their own job and have no coverage collector.
      - name: Test
        run: >
          dotnet test ErCv.Tests/ErCv.Tests.csproj --no-build --configuration Release
          --filter "Category!=E2E"
          --settings ErCv.Tests/coverage.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory test-results

      # Fails the job under 95% line coverage of Features/ and Services/ (98% when set), and writes the table to the
      # job summary. Two copies of the report exist (the trx logger copies it); they are identical.
      - name: Coverage
        run: python3 .github/scripts/coverage_summary.py "$(find test-results -name coverage.cobertura.xml | head -n 1)" --min 95

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runner image ships Google Chrome: Playwright drives it (no browser download) and so does PuppeteerSharp for the PDF test.
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      E2E_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ErCv.E2E/ErCv.E2E.csproj

      - name: Build
        run: dotnet build ErCv.E2E/ErCv.E2E.csproj --no-restore --configuration Release

      # The tests start the web app themselves, then drive it: composer, generate, downloads, shortcuts, mobile, axe.
      - name: Browser tests
        run: >
          dotnet test ErCv.E2E/ErCv.E2E.csproj --no-build --configuration Release
          --logger "trx;LogFileName=e2e-results.trx"
          --results-directory e2e-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e-results/
          if-no-files-found: ignore

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag er-cv-generator:ci .

