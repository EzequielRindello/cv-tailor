name: Corpus refresh

# Manual only for now. To run it every Monday, uncomment the schedule below.
# It needs the repo setting: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  refresh:
    name: Refresh the job post corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Drops expired, closed and taken-down posts and adds new ones. Also rewrites ErCv.Web/Data/sample-jobs.json.
      - name: Refresh
        run: dotnet run --project ErCv.Collector --configuration Release -- refresh

      - name: Report
        run: dotnet run --project ErCv.Collector --configuration Release -- report

      - name: Check
        run: dotnet run --project ErCv.Collector --configuration Release -- check

      # TEST-08 snapshots cover one real post per role family: new posts get one, dropped posts lose theirs.
      # The PR shows them next to the corpus change for review.
      - name: Snapshots
        env:
          ERCV_SNAPSHOTS: approve
        run: dotnet test ErCv.Tests --configuration Release --filter "Category=Snapshot"

      # A person reviews every change: the job only opens a PR, it never pushes to master.
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The corpus is already up to date."
            exit 0
          fi

          branch="corpus-refresh-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add corpus ErCv.Web/Data/sample-jobs.json ErCv.Tests/Snapshots/approved
          git commit -m "chore: refresh job post corpus"
          git push --force origin "$branch"

          gh pr create \
            --base master \
            --head "$branch" \
            --title "chore: refresh job post corpus ($(date -u +%Y-%m-%d))" \
            --body "Automated run of \`dotnet run --project ErCv.Collector -- refresh\`. Review the added and removed posts and \`corpus/report.md\` before merging." \
          || gh pr edit "$branch" --body "Updated by a later run on $(date -u +%Y-%m-%d)."

          # GitHub does not run pull_request workflows for a PR opened with GITHUB_TOKEN, so CI is started here.
          # Its checks land on the branch's head commit, which is what the PR shows.
          gh workflow run ci.yml --ref "$branch"
