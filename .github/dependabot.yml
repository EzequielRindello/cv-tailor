# OPS-02. Weekly, and grouped per ecosystem, so updates arrive as one PR each instead of one per package.
# Every PR runs ci.yml (build, tests, browser tests, Docker build) before it can be merged.
version: 2
updates:
  # Every project of er-cv-generator.sln (web app, tests, browser tests, collector)
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The .NET SDK and ASP.NET base images in the Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
