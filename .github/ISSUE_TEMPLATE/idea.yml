name: Idea
description: A feature or an improvement
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would help. Keep in mind the promise of the app: nothing in the CV is invented.
    validations:
      required: true
